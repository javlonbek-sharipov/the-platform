# Biome first, then `diagrams lint --staged`, so that broken or stale Diagrams
# never reach a commit. `--staged` lints what the commit would hold, not the
# working tree, so an SVG rendered but left unstaged is caught too. Install
# with `pnpm install` (the root `prepare` script).
pre-commit:
  piped: true
  commands:
    biome:
      priority: 1
      run: pnpm exec biome check --staged --no-errors-on-unmatched
    diagrams-lint:
      priority: 2
      run: pnpm exec diagrams lint --staged
